<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gazillionaire Unchained</title>
<link rel="icon" href="assets/img/gaz2.ico">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; }
  #screen { position: absolute; width: 640px; height: 480px; transform-origin: 0 0; overflow: hidden; background: #000;
            font-family: 'Microsoft Sans Serif', Tahoma, Arial, sans-serif; font-size: 11px; image-rendering: pixelated; }
  #start { position: absolute; inset: 0; cursor: pointer; background: #000 url(assets/img/title2.png) center/cover no-repeat; }
  #start small { position: absolute; right: 12px; bottom: 8px; color: #fff; font: bold 11px Arial, sans-serif; }
  .vbform { position: absolute; box-sizing: border-box; border: 0 solid #C0C0C0; background: #C0C0C0; }
  .vb-client { position: absolute; overflow: hidden; background-size: 100% 100%; }
  .vb-titlebar { background: #000080; color: #fff; font-weight: bold; text-align: center; line-height: 18px; height: 18px;
                 white-space: nowrap; overflow: hidden; }
  .vbctl { position: absolute; box-sizing: border-box; overflow: hidden; z-index: 1; }
  .vbctl.vb-Label, .vbctl.vb-Image { z-index: 0; }
  .vb-VideoSoftElastic > .vb-caption { position: absolute; display: flex; overflow: hidden; }
  .vb-flood, .vb-pic, .vb-bevel { position: absolute; pointer-events: none; }
  .vb-bevel { box-sizing: border-box; inset: 0; }
  .vb-childbevels { position: absolute; inset: 0; pointer-events: none; }
  .vb-Label { white-space: pre-wrap; overflow-wrap: break-word; }
  .vb-TextBox input { box-sizing: border-box; width: 100%; height: 100%; font: inherit; padding: 0 3px; outline: none; }
  .vb-ComboBox select { box-sizing: border-box; width: 100%; height: 100%; font: inherit; }
  .vb-list { position: absolute; inset: 0; overflow-y: auto; border: 1px solid #000; box-sizing: border-box; color: #000; }
  .vb-list > div { padding: 0 3px; white-space: nowrap; cursor: default; }
  .vb-list > div.sel { background: #000080; color: #fff; }
  .vb-Image img { width: 100%; height: 100%; display: block; }
  .vb-SSCheck, .vb-SSOption { display: flex; align-items: center; gap: 4px; padding: 0 3px; cursor: default; }
  .vb-checkbox, .vb-radio { flex: none; width: 12px; height: 12px; background: #fff; border: 1px solid #000;
                            display: flex; align-items: center; justify-content: center; font-size: 10px; color: #000; }
  .vb-radio { border-radius: 50%; }
  .vb-SpinButton { display: flex; flex-direction: column; }
  .vb-spin-up, .vb-spin-down { flex: 1; display: flex; align-items: center; justify-content: center; background: #C0C0C0;
                               border: 2px outset #eee; font-size: 9px; }
  .vb-grid { position: relative; }
  .vb-cell { position: absolute; box-sizing: border-box; border-right: 1px solid #808080; border-bottom: 1px solid #808080;
             padding: 0 3px; white-space: pre; overflow: hidden; background: center/contain no-repeat; }
  .vb-cell.fixed { background-color: #C0C0C0; }
  .vb-cell.sel { background-color: #000080; color: #fff; }
  .vb-GRAPH canvas { display: block; }
  .vb-modal-overlay { position: absolute; inset: 0; }
  .vb-msgbox { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 260px; max-width: 460px;
               background: #C0C0C0; border: 3px outset #fff; box-shadow: 2px 2px 0 #000; }
  .vb-msgtext { padding: 16px; white-space: pre-wrap; font: 12px Arial, sans-serif; }
  .vb-msgbox input { margin: 0 16px 8px; width: calc(100% - 32px); box-sizing: border-box; }
  .vb-msgbuttons { display: flex; justify-content: center; gap: 8px; padding: 0 0 12px; }
  .vb-msgbuttons button { min-width: 72px; font: bold 12px Arial, sans-serif; }
  .vb-ended { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 16px; color: #ff0; font: bold 22px Arial, sans-serif; }
  .vb-toast { position: fixed; left: 8px; bottom: 8px; background: #800; color: #fff; padding: 6px 10px; font: 12px monospace;
              z-index: 99999; max-width: 80vw; }
</style>
</head>
<body>
<div id="screen">
  <div id="start"><small>(click to continue)</small></div>
</div>
<script>
for (const src of ["legacy-fields.js", "vb.js", "gen/manifest.js"]) document.write('<script src="' + src + '?' + Date.now() + '"><\/script>');
</script>
<script>
  document.getElementById("start").addEventListener("click", (e) => {
    e.currentTarget.remove();
    VB.boot();
  }, { once: true });
</script>
</body>
</html>
